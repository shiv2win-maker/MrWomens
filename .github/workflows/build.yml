name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'

      - name: Configure Global Gradle Repositories
        run: |
          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
            buildscript {
              repositories {
                google()
                mavenCentral()
                maven { url "https://repo1.maven.org/maven2" }
                maven { url "https://plugins.gradle.org/m2/" }
              }
            }
            repositories {
              google()
              mavenCentral()
              maven { url "https://repo1.maven.org/maven2" }
              maven { url "https://plugins.gradle.org/m2/" }
            }
          }
          EOF

      - name: Generate Android Files
        run: flutter create --project-name mr_womens_billing --platforms=android .

      - name: Fix Min Android SDK
        run: |
          sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/' android/app/build.gradle || true
          sed -i 's/minSdkVersion .*/minSdkVersion 21/' android/app/build.gradle || true

      - name: Install Dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: mr-womens-billing-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
